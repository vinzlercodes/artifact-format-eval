[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifact-format-eval"
version = "0.1.0"
description = "Notebook helpers for the Artifact Format Evaluation Harness."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "nbformat>=5.10"
]

[dependency-groups]
dev = [
  "pytest>=8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["py_src/artifact_eval_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["py_src"]
